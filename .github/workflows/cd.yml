name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_REPO
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            # HTTPS + GITHUB_TOKEN; fetch + reset — VPS всегда = origin/main (без merge локальных коммитов)
            git -c credential.helper= fetch "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main
            git reset --hard FETCH_HEAD
            docker compose build web migrate
            docker compose --profile tools run --rm migrate
            docker compose up -d --force-recreate web
            echo "Waiting for health..."
            ok=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed"
              docker compose logs --tail=80 web
              exit 1
            fi
            curl -sf http://127.0.0.1:3000/api/health
            echo ""
            echo "Deploy OK"
